# Free live demo on Render: https://render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: robotaxi-dispatch-sim
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
